```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="register-card">
                    <div class="text-center mb-4">
                        <h1 class="h2 fw-bold text-primary">
                            Đăng ký tài khoản
                        </h1>
                        <p class="text-muted">
                            Tạo tài khoản để bắt đầu trải nghiệm dịch vụ.
                        </p>
                    </div>

                    <form action="#" method="post">
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label">
                                Họ và tên
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullname"
                                name="fullname"
                                placeholder="Nhập họ và tên"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Địa chỉ email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                autocomplete="email"
                                required
                            >
                            <div class="form-text">
                                Email sẽ được sử dụng để đăng nhập.
                            </div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Mật khẩu
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                            <div class="form-text">
                                Mật khẩu cần có ít nhất 8 ký tự.
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirm-password" class="form-label">
                                Xác nhận mật khẩu
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirm-password"
                                name="confirm-password"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                                required
                            >
                            <div id="password-message" class="form-text"></div>
                        </div>

                        <!-- Giới tính -->
                        <fieldset class="mb-3">
                            <legend class="form-label fs-6">Giới tính</legend>

                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="nam"
                                        required
                                    >
                                    <label class="form-check-label" for="male">
                                        Nam
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="nu"
                                    >
                                    <label class="form-check-label" for="female">
                                        Nữ
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="khac"
                                    >
                                    <label class="form-check-label" for="other">
                                        Khác
                                    </label>
                                </div>
                            </div>
                        </fieldset>

                        <!-- Sở thích -->
                        <fieldset class="mb-3">
                            <legend class="form-label fs-6">Sở thích</legend>

                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="hobbies[]"
                                        id="music"
                                        value="am-nhac"
                                    >
                                    <label class="form-check-label" for="music">
                                        Âm nhạc
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="hobbies[]"
                                        id="sports"
                                        value="the-thao"
                                    >
                                    <label class="form-check-label" for="sports">
                                        Thể thao
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="hobbies[]"
                                        id="travel"
                                        value="du-lich"
                                    >
                                    <label class="form-check-label" for="travel">
                                        Du lịch
                                    </label>
                                </div>
                            </div>
                        </fieldset>

                        <!-- Quốc gia -->
                        <div class="mb-4">
                            <label for="country" class="form-label">
                                Quốc gia
                            </label>
                            <select
                                class="form-select"
                                id="country"
                                name="country"
                                required
                            >
                                <option value="" selected disabled>
                                    -- Chọn quốc gia --
                                </option>
                                <option value="vietnam">Việt Nam</option>
                                <option value="japan">Nhật Bản</option>
                                <option value="korea">Hàn Quốc</option>
                                <option value="singapore">Singapore</option>
                                <option value="other">Quốc gia khác</option>
                            </select>
                        </div>

                        <!-- Nút đăng ký -->
                        <button type="submit" class="btn btn-primary w-100">
                            Đăng ký
                        </button>

                        <p class="text-muted text-center small mt-3 mb-0">
                            Bằng việc đăng ký, bạn đồng ý với các điều khoản
                            sử dụng của chúng tôi.
                        </p>
                    </form>
                </div>

                <p class="text-center text-muted small mt-4">
                    © 2026 - Bài tập Bootstrap Forms
                </p>

            </div>
        </div>
    </div>

    <!-- Kiểm tra hai mật khẩu có trùng nhau -->
    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const passwordMessage = document.getElementById("password-message");
        const form = document.querySelector("form");

        function checkPasswords() {
            if (!confirmPassword.value) {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "";
                passwordMessage.className = "form-text";
                return;
            }

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("Mật khẩu xác nhận không khớp.");
                passwordMessage.textContent = "Mật khẩu xác nhận chưa khớp.";
                passwordMessage.className = "form-text text-danger";
            } else {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "Mật khẩu khớp.";
                passwordMessage.className = "form-text text-success";
            }
        }

        password.addEventListener("input", checkPasswords);
        confirmPassword.addEventListener("input", checkPasswords);

        form.addEventListener("submit", function (event) {
            checkPasswords();

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            } else {
                event.preventDefault();
                alert("Form hợp lệ! Bài tập này chưa kết nối máy chủ để lưu tài khoản.");
            }
        });
    </script>
</body>
</html>
```
